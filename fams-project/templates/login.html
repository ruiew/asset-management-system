<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height">

<title>CAPI Login UI</title>

<!-- Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Alice -->
<link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- Yeseva One -->
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    width:100%;
    height:100%;
}

body{
    font-family:'Poppins', sans-serif;
    background:#ececec;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* ================= MAIN CONTAINER (FULL WIDTH) ================= */

.container{
    width:100%;
    max-width:1200px;
    background:#dddddd;
    padding:18px;
    border-radius:28px;
    position:relative;
    box-shadow:0 20px 45px rgba(0,0,0,0.15);
}

.container::after{
    content:"";
    position:absolute;
    width:180px;
    height:6px;
    background:#f0f0f0;
    bottom:-12px;
    left:50%;
    transform:translateX(-50%);
    border-radius:20px;
}

/* ================= SCREEN ================= */

.screen{
    display:flex;
    background:white;
    border-radius:20px;
    overflow:hidden;
    min-height:600px;
    width:100%;
}

/* ================= LEFT SIDE ================= */

.left{
    width:50%;
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,#071b5e 0%, #4a7aff 100%);
    padding:45px 35px;
    color:white;
}

/* ===== Animated Bubbles ===== */

.bubble1{
    position:absolute;
    width:370px;
    height:370px;
    background:rgba(255,255,255,0.08);
    background:linear-gradient(90deg, #90adfd 0%, #254d9d 100%);
    border-radius:50%;
    top:100px;
    left:-90px;
    animation:float1 7s ease-in-out infinite;
}

.bubble2{
    position:absolute;
    width:280px;
    height:280px;
    border:2px solid rgba(255,255,255,0.25);
    border-radius:50%;
    bottom:-100px;
    right:-20px;
    animation:float3 6s ease-in-out infinite;
}

.bubble3{
    position:absolute;
    width:180px;
    height:180px;
    background:rgba(255,255,255,0.12);
    background:linear-gradient(150deg, #90adfd 40%, #254d9d 100%);
    border-radius:50%;
    bottom:-30px;
    right:35px;
    animation:float3 5s ease-in-out infinite;
}

.smallBubble{
    position:absolute;
    background:rgba(255,255,255,0.2);
    border-radius:50%;
}

.sb1{
    width:35px;
    height:35px;
    left:25px;
    bottom:90px;
    background:linear-gradient(120deg, #90adfd 20%, #254d9d 100%);
    animation:updown 5s ease-in-out infinite;
}

.sb2{
    width:18px;
    height:18px;
    right:60px;
    bottom:160px;
    background:linear-gradient(150deg, #90adfd 40%, #254d9d 100%);
    animation:float3 6s ease-in-out infinite;
}

@keyframes float1{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-12px);}
    100%{transform:translateY(0px);}
}

@keyframes float2{
    0%{transform:translateY(0px);}
    50%{transform:translateY(10px);}
    100%{transform:translateY(0px);}
}

@keyframes float3{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0px);}
}

@keyframes updown{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

/* ===== Dots ===== */

.dots{
    position:absolute;
    width:60px;
    height:60px;
    background-image:radial-gradient(rgba(255,255,255,0.35) 1.8px, transparent 1.8px);
    background-size:10px 10px;
}

.d1{
    top:80px;
    right:40px;
}

.d2{
    bottom:45px;
    left:40px;
}

/* ===== Small Ring ===== */

.ring{
    position:absolute;
    border:2px solid rgba(255,255,255,0.35);
    border-radius:50%;
}

.r1{
    width:16px;
    height:16px;
    top:70px;
    right:130px;
    animation:updown 5s ease-in-out infinite;
}

.r2{
    width:10px;
    height:10px;
    left:110px;
    bottom:55px;
    animation:updown 5s ease-in-out infinite;
}

/* ================= LOGO ================= */

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:70px;
    position:relative;
    z-index:2;
}

.logo img{
    width:60px;
    height:auto;
}

.logo span{
    font-size:18px;
    font-weight:600;
    letter-spacing:0.5px;
}

/* ================= TEXT ================= */

.system{
    font-family:'Alice', serif;
    font-size:18px;
    margin-bottom:18px;
    position:relative;
    z-index:2;
    opacity:0.9;
}

.heading{
    font-family:'Alice', serif;
    font-size:52px;
    line-height:1.2;
    margin-bottom:30px;
    position:relative;
    z-index:2;
    color:white;
}


/* ================= RIGHT SIDE ================= */

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    background:white;
}

.formBox{
    width:100%;
    max-width:380px;
}

/* ===== Centered Welcome ===== */

.welcome{
    text-align:center;
    margin-bottom:35px;
}

.welcome h1{
    font-family:'Alice', sans-serif;
    background:linear-gradient(180deg, #071b5e 0%, #4a7aff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-size:48px;
    font-weight:400;
    margin-bottom:8px;
}

.welcome p{
    font-family:'Poppins', sans-serif;
    color:#888;
    font-size:14px;
}

/* ================= INPUT ================= */

.inputGroup{
    margin-bottom:20px;
}

.inputGroup label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
    color:#333;
    font-size:14px;
}

.inputGroup input{
    width:100%;
    padding:14px 18px;
    border-radius:40px;
    border:1.5px solid #e0e0e0;
    outline:none;
    font-family:'Poppins', sans-serif;
    transition:0.3s;
    background:white;
    font-size:14px;
}

.inputGroup input:focus{
    border-color:#4a7aff;
    box-shadow:0 0 0 3px rgba(74,122,255,0.15);
}

/* ================= OPTIONS ================= */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:13px;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    color:#666;
}

.checkbox-label input{
    width:15px;
    height:15px;
    cursor:pointer;
}

.forgot-link{
    text-decoration:underline;
    color:#4a7aff;
    cursor:pointer;
    font-weight:500;
}

.forgot-link:hover{
    color:#071b5e;
}

/* ================= BUTTON (Darker bottom, lighter top) ================= */

.loginBtn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:40px;
    font-size:16px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    color:white;
    cursor:pointer;
    background:linear-gradient(180deg, #7a93ff 0%, #0a204d 100%);
    box-shadow:0 8px 18px rgba(26,58,138,0.3);
    transition:0.3s;
}

.loginBtn:hover{
    transform:translateY(-2px);
    background:linear-gradient(180deg, #6a83ee 0%, #0a204d 100%);
}

/* ================= DIVIDER ================= */

.divider{
    display:flex;
    align-items:center;
    margin:30px 0 25px;
    color:#aaa;
    font-size:13px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e5e5e5;
}

.divider span{
    margin:0 10px;
}

/* ================= SOCIAL ================= */

.socials{
    display:flex;
    justify-content:center;
    gap:15px;
}

.socialBtn{
    width:70px;
    height:48px;
    border-radius:35px;
    border:1px solid #e0e0e0;
    background:white;
    cursor:pointer;
    transition:0.3s;
    font-size:22px;
}

.socialBtn:hover{
    background:#f5f5f5;
    transform:translateY(-2px);
    border-color:#4a7aff;
}

.google{
    color:#db4437;
}

.facebook{
    color:#1877f2;
}

.email{
    color:#2ca24c;
}

/* ================= FOOTER ================= */

.footer{
    margin-top:28px;
    text-align:center;
    font-size:11px;
    color:#aaa;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){
    .screen{
        flex-direction:column;
    }

    .left,
    .right{
        width:100%;
    }

    .heading{
        font-size:40px;
    }

    .left{
        padding:35px 25px;
    }
}

@media(max-width:500px){
    body{
        padding:10px;
    }
    
    .container{
        padding:10px;
    }
    
    .heading{
        font-size:32px;
    }
    
    .welcome h1{
        font-size:38px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="screen">

        <!-- LEFT -->
        <div class="left">

            <!-- Animated Shapes -->
            <div class="bubble1"></div>
            <div class="bubble2">
                <div class="bubble2-inner"></div>
                <div class="bubble2-ring-bubble"></div>
            </div>
            <div class="bubble3"></div>

            <div class="smallBubble sb1"></div>
            <div class="smallBubble sb2"></div>

            <div class="dots d1"></div>
            <div class="dots d2"></div>

            <div class="ring r1">
                <div class="r1-inner"></div>
            </div>
            <div class="ring r2">
             <div class="r2-inner"></div>
            </div>

            <!-- Logo -->
            <div class="logo">
                <img src="capi-logo.png" alt="CAPI Logo" id="capiLogo">
                <span>CAPI SDN. BHD.</span>
            </div>

            <!-- Text -->
            <div class="system">
                Fixed Asset Management System
            </div>

            <div class="heading">
                Secure Access<br>
                Smarter Control
            </div>

            <div class="line"></div>

        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="formBox">

                <!-- Centered Welcome (Gradient colour, Alice font) -->
                <div class="welcome">
                    <h1 style="font-family: 'Yeseva One', cursive; font-weight: normal;">Welcome !</strong></h1>
                    <p>Please login to your account.</p>
                </div>

                <!-- FORM -->
                <form id="loginForm">

                    <div class="inputGroup">
                        <label><strong>Email Address</strong></label>
                        <input 
                            type="email"
                            id="emailInput"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="inputGroup">
                        <label><strong>Password</strong></label>
                        <input 
                            type="password"
                            id="passwordInput"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <div class="options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberCheckbox">
                            Remember me
                        </label>
                        <a class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
                    </div>

                    <button type="submit" class="loginBtn">
                        Login
                    </button>

                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>or continue with</span>
                </div>

                <!-- Social Buttons -->
                <div class="socials">

                    <button class="socialBtn" id="googleBtn">
                        <i class="fa-brands fa-google google"></i>
                    </button>

                    <button class="socialBtn" id="facebookBtn">
                        <i class="fa-brands fa-facebook facebook"></i>
                    </button>

                    <button class="socialBtn" id="emailLoginBtn">
                        <i class="fa-regular fa-envelope email"></i>
                    </button>

                </div>

                <!-- Footer -->
                <div class="footer">
                    © 2026 Capi Sdn. Bhd. All rights reserved.
                </div>

            </div>

        </div>

    </div>

</div>

<script>

// ==================== LOGO LOAD ====================
const logoImg = document.getElementById('capiLogo');
logoImg.src = "capi-logo.png";

logoImg.onerror = function() {
    this.style.display = 'none';
};

// ==================== REMEMBER ME ====================

const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const rememberCheckbox = document.getElementById('rememberCheckbox');

window.addEventListener('DOMContentLoaded', function() {
    const savedEmail = localStorage.getItem('savedEmail');
    const savedPassword = localStorage.getItem('savedPassword');
    const rememberChecked = localStorage.getItem('rememberMe') === 'true';
    
    if (rememberChecked && savedEmail && savedPassword) {
        emailInput.value = savedEmail;
        passwordInput.value = savedPassword;
        rememberCheckbox.checked = true;
    }
});

// ==================== LOGIN ====================

document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    
    const email = emailInput.value;
    const password = passwordInput.value;
    
    if (!email || !password) {
        alert("Please enter both email and password");
        return;
    }
    
    if (rememberCheckbox.checked) {
        localStorage.setItem('savedEmail', email);
        localStorage.setItem('savedPassword', password);
        localStorage.setItem('rememberMe', 'true');
    } else {
        localStorage.removeItem('savedEmail');
        localStorage.removeItem('savedPassword');
        localStorage.setItem('rememberMe', 'false');
    }
    
    alert("Login Successful!");
});

// ==================== FORGOT PASSWORD ====================

document.getElementById("forgotPasswordLink").addEventListener("click", function(e){
    e.preventDefault();
    
    const resetWindow = window.open('', '_blank', 'width=500,height=550,left=200,top=100');
    resetWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Reset Password - CAPI FAMS</title>
            <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
            <style>
                body {
                    font-family: 'Poppins', Arial, sans-serif;
                    background: linear-gradient(180deg, #071b5e, #4a7aff);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                    margin: 0;
                    padding: 20px;
                }
                .reset-container {
                    background: white;
                    padding: 40px;
                    border-radius: 20px;
                    width: 380px;
                    text-align: center;
                    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
                }
                h2 {
                    background: linear-gradient(180deg, #071b5e, #4a7aff);
                    -webkit-background-clip: text;
                    background-clip: text;
                    color: transparent;
                    margin-bottom: 10px;
                }
                p {
                    color: #666;
                    margin-bottom: 25px;
                    font-size: 14px;
                }
                input {
                    width: 100%;
                    padding: 12px 18px;
                    border-radius: 40px;
                    border: 1.5px solid #e0e0e0;
                    margin-bottom: 20px;
                    font-size: 14px;
                    box-sizing: border-box;
                }
                input:focus {
                    outline: none;
                    border-color: #4a7aff;
                }
                button {
                    width: 100%;
                    padding: 12px;
                    border-radius: 40px;
                    border: none;
                    background: linear-gradient(180deg, #7a93ff, #1a3a8a);
                    color: white;
                    font-size: 15px;
                    font-weight: 600;
                    cursor: pointer;
                    margin-bottom: 12px;
                }
                button:hover {
                    background: linear-gradient(180deg, #6a83ee, #0f2d6e);
                }
                .close-btn {
                    background: #ccc;
                    color: #333;
                }
                .close-btn:hover {
                    background: #aaa;
                }
                .message {
                    font-size: 12px;
                    margin-top: 10px;
                }
            </style>
        </head>
        <body>
            <div class="reset-container">
                <h2>Reset Password</h2>
                <p>Enter your email address to receive password reset instructions.</p>
                <input type="email" id="resetEmail" placeholder="Email address">
                <button id="sendResetBtn">Send Reset Link</button>
                <button class="close-btn" onclick="window.close()">Close</button>
                <div id="resetMessage" class="message"></div>
            </div>
            <script>
                document.getElementById('sendResetBtn').addEventListener('click', function() {
                    const email = document.getElementById('resetEmail').value;
                    if (!email) {
                        document.getElementById('resetMessage').textContent = 'Please enter your email address.';
                        document.getElementById('resetMessage').style.color = 'red';
                    } else {
                        document.getElementById('resetMessage').textContent = 'Reset link sent to ' + email;
                        document.getElementById('resetMessage').style.color = '#1a3a8a';
                        setTimeout(() => window.close(), 2000);
                    }
                });
            <\/script>
        </body>
        </html>
    `);
});

// ==================== SOCIAL LOGIN (No alerts - opens window only) ====================

document.getElementById("googleBtn").addEventListener("click", function() {
    window.open('https://accounts.google.com/o/oauth2/v2/auth?client_id=demo&redirect_uri=http://localhost:5000/callback&response_type=code&scope=email%20profile', '_blank', 'width=500,height=600,left=200,top=100');
});

document.getElementById("facebookBtn").addEventListener("click", function() {
    window.open('https://www.facebook.com/v12.0/dialog/oauth?client_id=demo&redirect_uri=http://localhost:5000/callback&scope=email', '_blank', 'width=500,height=600,left=200,top=100');
});

document.getElementById("emailLoginBtn").addEventListener("click", function() {
    const emailWindow = window.open('', '_blank', 'width=450,height=500,left=200,top=100');
    emailWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Email Sign In - CAPI FAMS</title>
            <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
            <style>
                body {
                    font-family: 'Poppins', Arial, sans-serif;

                    text-align: center;

                }
                h2 {
                    background: linear-gradient(180deg, #071b5e, #4a7aff);
                    -webkit-background-clip: text;
                    background-clip: text;
                    color: transparent;
                    margin-bottom: 10px;
                }
                p {
                    color: #666;
                    margin-bottom: 25px;
                    font-size: 14px;
                }
                input {
                    width: 100%;
                    padding: 12px 18px;
                    border-radius: 40px;
                    border: 1.5px solid #e0e0e0;
                    margin-bottom: 15px;
                    box-sizing: border-box;
                }
                input:focus {
                    outline: none;
                    border-color: #4a7aff;
                }
                button {
                    width: 100%;
                    padding: 12px;
                    border-radius: 40px;
                    border: none;
                    background: linear-gradient(180deg, #7a93ff, #1a3a8a);
                    color: white;
                    font-size: 15px;
                    font-weight: 600;
                    cursor: pointer;
                    margin-bottom: 10px;
                }
                button:hover {
                    background: linear-gradient(180deg, #6a83ee, #0f2d6e);
                }
                .close-btn {
                    background: #ccc;
                    color: #333;
                }
                .close-btn:hover {
                    background: #aaa;
                }
            </style>
        </head>
        <body>
            <div class="login-container">
                <h2>Email Sign In</h2>
                <p>Sign in with your email account</p>
                <input type="email" id="loginEmail" placeholder="Email address">
                <input type="password" id="loginPassword" placeholder="Password">
                <button id="signInBtn">Sign In</button>
                <button class="close-btn" onclick="window.close()">Close</button>
            </div>
            <script>
                document.getElementById('signInBtn').addEventListener('click', function() {
                    const email = document.getElementById('loginEmail').value;
                    const password = document.getElementById('loginPassword').value;
                    if (!email || !password) {
                        alert('Please enter both email and password');
                    } else {
                        alert('Login successful! Welcome ' + email);
                        window.close();
                    }
                });
            <\/script>
        </body>
        </html>
    `);
});

</script>

</body>
</html>
