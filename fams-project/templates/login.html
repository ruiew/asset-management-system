<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height">

<title>CAPI Login UI - Functional Demo</title>

<!-- Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Alice -->
<link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- Yeseva One -->
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    width:100%;
    height:100%;
}

body{
    font-family:'Poppins', sans-serif;
    background:#ececec;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1200px;
    background:#dddddd;
    padding:18px;
    border-radius:28px;
    position:relative;
    box-shadow:0 20px 45px rgba(0,0,0,0.15);
}

.container::after{
    content:"";
    position:absolute;
    width:180px;
    height:6px;
    background:#f0f0f0;
    bottom:-12px;
    left:50%;
    transform:translateX(-50%);
    border-radius:20px;
}

.screen{
    display:flex;
    background:white;
    border-radius:20px;
    overflow:hidden;
    min-height:600px;
    width:100%;
}

.left{
    width:50%;
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,#071b5e 0%, #4a7aff 100%);
    padding:45px 35px;
    color:white;
}

.bubble1{
    position:absolute;
    width:370px;
    height:370px;
    background:rgba(255,255,255,0.08);
    background:linear-gradient(90deg, #90adfd 0%, #254d9d 100%);
    border-radius:50%;
    top:100px;
    left:-90px;
    animation:float1 7s ease-in-out infinite;
}

.bubble2{
    position:absolute;
    width:280px;
    height:280px;
    border:2px solid rgba(255,255,255,0.25);
    border-radius:50%;
    bottom:-100px;
    right:-20px;
    animation:float3 6s ease-in-out infinite;
}

.bubble3{
    position:absolute;
    width:180px;
    height:180px;
    background:rgba(255,255,255,0.12);
    background:linear-gradient(150deg, #90adfd 40%, #254d9d 100%);
    border-radius:50%;
    bottom:-30px;
    right:35px;
    animation:float3 5s ease-in-out infinite;
}

.smallBubble{
    position:absolute;
    background:rgba(255,255,255,0.2);
    border-radius:50%;
}

.sb1{
    width:35px;
    height:35px;
    left:25px;
    bottom:90px;
    background:linear-gradient(120deg, #90adfd 20%, #254d9d 100%);
    animation:updown 5s ease-in-out infinite;
}

.sb2{
    width:18px;
    height:18px;
    right:60px;
    bottom:160px;
    background:linear-gradient(150deg, #90adfd 40%, #254d9d 100%);
    animation:float3 6s ease-in-out infinite;
}

@keyframes float1{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-12px);}
    100%{transform:translateY(0px);}
}

@keyframes float2{
    0%{transform:translateY(0px);}
    50%{transform:translateY(10px);}
    100%{transform:translateY(0px);}
}

@keyframes float3{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0px);}
}

@keyframes updown{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

.dots{
    position:absolute;
    width:60px;
    height:60px;
    background-image:radial-gradient(rgba(255,255,255,0.35) 1.8px, transparent 1.8px);
    background-size:10px 10px;
}

.d1{
    top:80px;
    right:40px;
}

.d2{
    bottom:45px;
    left:40px;
}

.ring{
    position:absolute;
    border:2px solid rgba(255,255,255,0.35);
    border-radius:50%;
}

.r1{
    width:16px;
    height:16px;
    top:70px;
    right:130px;
    animation:updown 5s ease-in-out infinite;
}

.r2{
    width:10px;
    height:10px;
    left:110px;
    bottom:55px;
    animation:updown 5s ease-in-out infinite;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:70px;
    position:relative;
    z-index:2;
}

.logo img{
    width:60px;
    height:auto;
}

.logo span{
    font-size:18px;
    font-weight:600;
    letter-spacing:0.5px;
}

.system{
    font-family:'Alice', serif;
    font-size:18px;
    margin-bottom:18px;
    position:relative;
    z-index:2;
    opacity:0.9;
}

.heading{
    font-family:'Alice', serif;
    font-size:52px;
    line-height:1.2;
    margin-bottom:30px;
    position:relative;
    z-index:2;
    color:white;
}

.line{
    width:140px;
    height:2px;
    background:rgba(255,255,255,0.5);
    position:relative;
    z-index:10;
    margin-top:20px;
}

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    background:white;
}

.formBox{
    width:100%;
    max-width:380px;
}

.welcome{
    text-align:center;
    margin-bottom:35px;
}

.welcome h1{
    font-family:'Yeseva One', cursive;
    background:linear-gradient(180deg, #071b5e 0%, #4a7aff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-size:48px;
    font-weight:400;
    margin-bottom:8px;
}

.welcome p{
    font-family:'Poppins', sans-serif;
    color:#888;
    font-size:14px;
}

.inputGroup{
    margin-bottom:20px;
}

.inputGroup label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
    color:#333;
    font-size:14px;
}

.inputGroup input{
    width:100%;
    padding:14px 18px;
    border-radius:40px;
    border:1.5px solid #e0e0e0;
    outline:none;
    font-family:'Poppins', sans-serif;
    transition:0.3s;
    background:white;
    font-size:14px;
}

.inputGroup input:focus{
    border-color:#4a7aff;
    box-shadow:0 0 0 3px rgba(74,122,255,0.15);
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:13px;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    color:#666;
}

.checkbox-label input{
    width:15px;
    height:15px;
    cursor:pointer;
}

.forgot-link{
    text-decoration:underline;
    color:#4a7aff;
    cursor:pointer;
    font-weight:500;
}

.forgot-link:hover{
    color:#071b5e;
}

.loginBtn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:40px;
    font-size:16px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    color:white;
    cursor:pointer;
    background:linear-gradient(180deg, #7a93ff 0%, #0a204d 100%);
    box-shadow:0 8px 18px rgba(26,58,138,0.3);
    transition:0.3s;
}

.loginBtn:hover{
    transform:translateY(-2px);
    background:linear-gradient(180deg, #6a83ee 0%, #0a204d 100%);
}

.footer{
    margin-top:28px;
    text-align:center;
    font-size:11px;
    color:#aaa;
}

@media(max-width:900px){
    .screen{
        flex-direction:column;
    }
    .left,
    .right{
        width:100%;
    }
    .heading{
        font-size:40px;
    }
    .left{
        padding:35px 25px;
    }
}

@media(max-width:500px){
    body{
        padding:10px;
    }
    .container{
        padding:10px;
    }
    .heading{
        font-size:32px;
    }
    .welcome h1{
        font-size:38px;
    }
}

</style>
</head>

<body>

<div class="container">
    <div class="screen">
        <!-- LEFT -->
        <div class="left">
            <div class="bubble1"></div>
            <div class="bubble2"></div>
            <div class="bubble3"></div>
            <div class="smallBubble sb1"></div>
            <div class="smallBubble sb2"></div>
            <div class="dots d1"></div>
            <div class="dots d2"></div>
            <div class="ring r1"></div>
            <div class="ring r2"></div>

            <div class="logo">
                <img src="capi-logo.png" alt="CAPI Logo" id="capiLogo">
                <span>CAPI SDN. BHD.</span>
            </div>
            <div class="system">Fixed Asset Management System</div>
            <div class="heading">Secure Access<br>Smarter Control</div>
            <div class="line"></div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <div class="formBox">
                <div class="welcome">
                    <h1 style="font-family: 'Yeseva One', cursive; font-weight: normal;">Welcome !</h1>
                    <p>Please login to your account.</p>
                </div>

                <form id="loginForm">
                    <div class="inputGroup">
                        <label><strong>Email Address</strong></label>
                        <input type="email" id="emailInput" placeholder="Enter your email" required>
                    </div>
                    <div class="inputGroup">
                        <label><strong>Password</strong></label>
                        <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    </div>
                    <div class="options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberCheckbox"> Remember me
                        </label>
                        <a class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
                    </div>
                    <button type="submit" class="loginBtn">Login</button>
                </form>

                <div class="footer">© 2026 Capi Sdn. Bhd. All rights reserved.</div>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== USER DATABASE WITH ROLES ====================
const users = [
    { email: "admin@capi.com", password: "admin123", role: "admin", name: "Admin User" },
    { email: "user@capi.com", password: "password123", role: "staff", name: "Staff User" }
];

// Initialize users in localStorage if not exists
if (!localStorage.getItem('users')) {
    localStorage.setItem('users', JSON.stringify(users));
}

// ==================== LOGO LOAD ====================
const logoImg = document.getElementById('capiLogo');
if (logoImg) {
    logoImg.src = "capi-logo.png";
    logoImg.onerror = function() { this.style.display = 'none'; };
}

// ==================== CHECK SESSION ====================
function checkSession() {
    const loggedInUser = localStorage.getItem('loggedInUser');
    if (loggedInUser) {
        const user = JSON.parse(loggedInUser);
        redirectBasedOnRole(user);
    }
}

function redirectBasedOnRole(user) {
    const formBox = document.querySelector('.formBox');
    
    if (user.role === 'admin') {
        // Admin Dashboard View
        formBox.innerHTML = `
            <div style="text-align: center; padding: 40px;">
                <i class="fa-solid fa-shield-haltered" style="font-size: 64px; color: #4a7aff;"></i>
                <h2 style="margin: 20px 0; color: #071b5e;">Admin Dashboard</h2>
                <p style="margin-bottom: 10px;">Welcome back, <strong>${user.name}</strong></p>
                <p style="margin-bottom: 20px; color: #666;">Email: ${user.email} | Role: Administrator</p>
                
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button id="viewAllAssetsBtn" class="loginBtn" style="background: linear-gradient(180deg, #4a7aff, #071b5e);">📊 View All Company Assets</button>
                    <button id="manageUsersBtn" class="loginBtn" style="background: linear-gradient(180deg, #28a745, #1e7e34);">👥 Manage Users & Roles</button>
                    <button id="staffAssetBtn" class="loginBtn" style="background: linear-gradient(180deg, #17a2b8, #0f6674);">📱 My Asset Page (Staff View)</button>
                    <button id="logoutBtn" class="loginBtn" style="background: linear-gradient(180deg, #dc3545, #a71d2a);">🚪 Logout</button>
                </div>
            </div>
        `;
        
        document.getElementById('viewAllAssetsBtn')?.addEventListener('click', () => showAllAssets());
        document.getElementById('manageUsersBtn')?.addEventListener('click', () => manageUsers());
        document.getElementById('staffAssetBtn')?.addEventListener('click', () => showMyAssetPage(user));
        document.getElementById('logoutBtn')?.addEventListener('click', logout);
        
    } else if (user.role === 'staff') {
        // Staff My Asset Page ONLY
        showMyAssetPage(user);
    }
}

function showMyAssetPage(user) {
    const formBox = document.querySelector('.formBox');
    
    // Sample assets assigned to staff based on email
    const staffAssets = getAssetsByUser(user.email);
    
    let assetsHtml = '';
    if (staffAssets.length === 0) {
        assetsHtml = '<p style="color: #999;">No assets assigned to you yet.</p>';
    } else {
        assetsHtml = `
            <table style="width: 100%; text-align: left; border-collapse: collapse; margin-top: 15px;">
                <tr style="background: #f0f0f0;">
                    <th style="padding: 10px;">Asset Name</th>
                    <th style="padding: 10px;">Serial No.</th>
                    <th style="padding: 10px;">Status</th>
                </tr>
                ${staffAssets.map(asset => `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">${asset.name}</td>
                        <td style="padding: 10px;">${asset.serial}</td>
                        <td style="padding: 10px;"><span style="background: ${asset.status === 'Good' ? '#28a745' : '#ffc107'}; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px;">${asset.status}</span></td>
                    </tr>
                `).join('')}
            </table>
        `;
    }
    
    formBox.innerHTML = `
        <div style="text-align: center; padding: 20px;">
            <i class="fa-solid fa-laptop" style="font-size: 64px; color: #4a7aff;"></i>
            <h2 style="margin: 20px 0; color: #071b5e;">My Assets</h2>
            <p style="margin-bottom: 5px;">Welcome, <strong>${user.name}</strong></p>
            <p style="margin-bottom: 20px; color: #666;">Email: ${user.email} | Role: Staff</p>
            
            <div style="background: #f8f9fa; border-radius: 15px; padding: 20px; text-align: left;">
                <h3 style="margin-bottom: 15px; color: #333;">📦 Assets Assigned to You:</h3>
                ${assetsHtml}
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button id="requestAssetBtn" class="loginBtn" style="background: linear-gradient(180deg, #17a2b8, #0f6674); padding: 10px 20px; width: auto;">📝 Request New Asset</button>
                <button id="logoutBtn" class="loginBtn" style="background: linear-gradient(180deg, #dc3545, #a71d2a); padding: 10px 20px; width: auto;">🚪 Logout</button>
            </div>
        </div>
    `;
    
    document.getElementById('requestAssetBtn')?.addEventListener('click', () => {
        alert("Asset request submitted to admin!\n\nYou will be notified when approved.");
    });
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
}

// Sample asset database
function getAssetsByUser(email) {
    const assetDatabase = {
        "user@capi.com": [
            { name: "Dell XPS Laptop", serial: "Dell-XPS-001", status: "Good" },
            { name: "Monitor 24-inch", serial: "MON-24-002", status: "Good" },
            { name: "Wireless Mouse", serial: "MOU-001", status: "Needs Replacement" }
        ],
        "admin@capi.com": [
            { name: "MacBook Pro", serial: "MBP-2024-001", status: "Good" },
            { name: "iPhone 15", serial: "IP15-002", status: "Good" }
        ]
    };
    return assetDatabase[email] || [];
}

function showAllAssets() {
    const allAssets = [
        { name: "Dell XPS Laptop", serial: "Dell-XPS-001", assignedTo: "user@capi.com", status: "Good" },
        { name: "MacBook Pro", serial: "MBP-2024-001", assignedTo: "admin@capi.com", status: "Good" },
        { name: "Monitor 24-inch", serial: "MON-24-002", assignedTo: "user@capi.com", status: "Good" },
        { name: "iPhone 15", serial: "IP15-002", assignedTo: "admin@capi.com", status: "Good" },
        { name: "HP Printer", serial: "HP-456", assignedTo: "None", status: "Available" }
    ];
    
    let tableHtml = '<table style="width: 100%; border-collapse: collapse;">';
    tableHtml += '<tr style="background: #071b5e; color: white;"><th style="padding: 10px;">Asset</th><th style="padding: 10px;">Serial</th><th style="padding: 10px;">Assigned To</th><th style="padding: 10px;">Status</th></tr>';
    
    allAssets.forEach(asset => {
        tableHtml += `<tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 10px;">${asset.name}</td>
            <td style="padding: 10px;">${asset.serial}</td>
            <td style="padding: 10px;">${asset.assignedTo}</td>
            <td style="padding: 10px;"><span style="background: ${asset.status === 'Good' ? '#28a745' : '#6c757d'}; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px;">${asset.status}</span></td>
        </tr>`;
    });
    tableHtml += '</table><p style="margin-top: 15px; font-size: 12px; color: #666;">Total Assets: ' + allAssets.length + '</p>';
    
    const formBox = document.querySelector('.formBox');
    formBox.innerHTML = `
        <div style="padding: 20px;">
            <h2 style="color: #071b5e; margin-bottom: 20px;">📊 All Company Assets</h2>
            ${tableHtml}
            <button id="backBtn" class="loginBtn" style="margin-top: 20px;">← Back to Dashboard</button>
        </div>
    `;
    document.getElementById('backBtn')?.addEventListener('click', () => window.location.reload());
}

function manageUsers() {
    const usersList = JSON.parse(localStorage.getItem('users')) || [];
    let userHtml = '<table style="width: 100%; border-collapse: collapse;">';
    userHtml += '<tr style="background: #071b5e; color: white;"><th style="padding: 10px;">Email</th><th style="padding: 10px;">Role</th><th style="padding: 10px;">Actions</th></tr>';
    
    usersList.forEach((user, index) => {
        userHtml += `<tr style="border-bottom: 1px solid #ddd;">
            <td style="padding: 10px;">${user.email}</td>
            <td style="padding: 10px;">${user.role}</td>
            <td style="padding: 10px;">
                <button onclick="changeRole(${index})" style="background: #4a7aff; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Change Role</button>
            </td>
        </tr>`;
    });
    userHtml += '</table>';
    
    const formBox = document.querySelector('.formBox');
    formBox.innerHTML = `
        <div style="padding: 20px;">
            <h2 style="color: #071b5e; margin-bottom: 20px;">👥 User Management</h2>
            ${userHtml}
            <div style="margin-top: 20px;">
                <input type="email" id="newUserEmail" placeholder="New user email" style="padding: 10px; width: 60%; margin-right: 10px;">
                <select id="newUserRole" style="padding: 10px;">
                    <option value="staff">Staff</option>
                    <option value="admin">Admin</option>
                </select>
                <button id="addUserBtn" class="loginBtn" style="margin-top: 10px; width: auto; padding: 10px 20px;">➕ Add User</button>
            </div>
            <button id="backBtn" class="loginBtn" style="margin-top: 20px;">← Back to Dashboard</button>
        </div>
    `;
    
    document.getElementById('addUserBtn')?.addEventListener('click', () => {
        const newEmail = document.getElementById('newUserEmail').value;
        const newRole = document.getElementById('newUserRole').value;
        if (newEmail) {
            const users = JSON.parse(localStorage.getItem('users'));
            users.push({ email: newEmail, password: "changeme123", role: newRole, name: newEmail.split('@')[0] });
            localStorage.setItem('users', JSON.stringify(users));
            alert(`User ${newEmail} added with role: ${newRole}`);
            manageUsers();
        }
    });
    document.getElementById('backBtn')?.addEventListener('click', () => window.location.reload());
}

window.changeRole = (index) => {
    const users = JSON.parse(localStorage.getItem('users'));
    const newRole = users[index].role === 'admin' ? 'staff' : 'admin';
    users[index].role = newRole;
    localStorage.setItem('users', JSON.stringify(users));
    alert(`Role changed to: ${newRole}`);
    manageUsers();
};

// ==================== LOGIN FUNCTION ====================
function logout() {
    localStorage.removeItem('loggedInUser');
    window.location.reload();
}

window.addEventListener('DOMContentLoaded', function() {
    const savedEmail = localStorage.getItem('savedEmail');
    if (savedEmail && document.getElementById('emailInput')) {
        document.getElementById('emailInput').value = savedEmail;
    }
    checkSession();
});

document.getElementById("loginForm")?.addEventListener("submit", function(e) {
    e.preventDefault();
    
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const remember = document.getElementById('rememberCheckbox')?.checked || false;
    
    if (!email || !password) {
        alert("Please enter both email and password");
        return;
    }
    
    const users = JSON.parse(localStorage.getItem('users')) || [];
    const user = users.find(u => u.email === email && u.password === password);
    
    if (user) {
        localStorage.setItem('loggedInUser', JSON.stringify({ email: user.email, role: user.role, name: user.name }));
        
        if (remember) {
            localStorage.setItem('savedEmail', email);
        } else {
            localStorage.removeItem('savedEmail');
        }
        
        redirectBasedOnRole({ email: user.email, role: user.role, name: user.name });
    } else {
        alert("Invalid email or password!\n\nDemo credentials:\nAdmin: admin@capi.com / admin123\nStaff: user@capi.com / password123");
    }
});

document.getElementById("forgotPasswordLink")?.addEventListener("click", function(e) {
    e.preventDefault();
    alert("Please contact your system administrator to reset your password.");
});
</script>

</body>
</html>
