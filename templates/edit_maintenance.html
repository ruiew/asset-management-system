{% extends "base.html" %}

{% block title %}Edit Maintenance Record{% endblock %}

{% block welcome %}
<h1 style="font-family: 'Yeseva One', cursive; font-weight: normal; font-size: 26px; color: #071b5e; margin: 0;">
    Edit Maintenance Record
</h1>
<p style="font-size: 14px; color: #888; margin: 5px 0 0 0;">
    Update maintenance record details.
</p>
{% endblock %}

{% block content %}
<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label>Asset</label>
            <p style="padding: 10px 0; font-weight: 500; color: #071b5e;">{{ record.asset_name }}</p>
            <input type="hidden" name="asset_id" value="{{ record.asset_id }}">
        </div>
        <div class="form-group">
            <label>Date <span class="required">*</span></label>
            <input type="date" name="maintenance_date" value="{{ record.maintenance_date }}" required>
        </div>
        <div class="form-group">
            <label>Type <span class="required">*</span></label>
            <select name="type" required>
                <option value="Repair" {% if record.type == 'Repair' %}selected{% endif %}>Repair</option>
                <option value="Preventive" {% if record.type == 'Preventive' %}selected{% endif %}>Preventive</option>
                <option value="Calibration" {% if record.type == 'Calibration' %}selected{% endif %}>Calibration</option>
                <option value="Inspection" {% if record.type == 'Inspection' %}selected{% endif %}>Inspection</option>
            </select>
        </div>
        <div class="form-group">
            <label>Cost (RM)</label>
            <input type="number" name="cost" step="0.01" value="{{ record.cost }}">
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" value="{{ record.description|default('') }}" placeholder="Brief description">
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="Scheduled" {% if record.status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
                <option value="In Progress" {% if record.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                <option value="Completed" {% if record.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Update Record</button>
            <a href="{{ url_for('maintenance') }}" class="btn-secondary"><i class="fas fa-times"></i> Cancel</a>
        </div>
    </form>
</div>

<style>
.form-container {
    max-width: 600px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #333;
    font-size: 14px;
}
.form-group .required {
    color: #dc3545;
}
.form-group input,
.form-group select {
    width: 100%;
    padding: 12px 15px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.3s;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}
.form-group input:focus,
.form-group select:focus {
    border-color: #4a7aff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(74,122,255,0.15);
}
.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}
.form-actions a {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.btn-primary i, .btn-secondary i {
    margin-right: 5px;
}
</style>
{% endblock %}
